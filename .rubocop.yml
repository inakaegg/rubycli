inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'tmp/**/*'
    - '.worktrees/**/*'
    - 'vendor/**/*'

# lib/ and test/ are written with single quotes; the gemspec-style files follow suit.
Style/StringLiterals:
  EnforcedStyle: single_quotes

# Documentation lives in README.md / README.ja.md rather than per-class comments.
Style/Documentation:
  Enabled: false

# Rubycli deliberately evaluates user-supplied Ruby (--eval-args, --pre-script);
# the entry points are documented and isolated in EvalCoercer / Runner.
Security/Eval:
  Exclude:
    - 'lib/rubycli/eval_coercer.rb'
    - 'lib/rubycli/runner.rb'

# Long expectation strings and generated fixtures make test files noisy here;
# remaining exclusions live in .rubocop_todo.yml.
Metrics/BlockLength:
  AllowedMethods:
    - Struct.new

Layout/LineLength:
  Max: 120
